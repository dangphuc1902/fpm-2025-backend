name: fpm-monolith-project

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: fpm-monolith-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-monolith
    restart: always

  backend-monolith:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-monolith
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: monolith,prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: auth
      DB_USER: ${DB_USER:-dev}
      DB_PASS: ${DB_PASS:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-supersecretkeyforfpm2025mustbelongenoughotherwiseitwillthrowanexception}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  mysql:
    image: mysql:8.0
    container_name: fpm-monolith-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ${DB_USER:-dev}
      MYSQL_PASSWORD: ${DB_PASS:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: fpm-monolith-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  mysql_data:
  redis_data:
