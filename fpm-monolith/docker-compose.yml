name: fpm-monolith-project

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: fpm-monolith-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-monolith
    restart: always

  backend-monolith:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-monolith
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: monolith,prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fpm_db
      DB_USER: ${DB_USER:-dev}
      DB_PASS: ${DB_PASS:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-supersecretkeyforfpm2025mustbelongenoughotherwiseitwillthrowanexception}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: fpm-monolith-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: fpm_db
      POSTGRES_USER: ${DB_USER:-dev}
      POSTGRES_PASSWORD: ${DB_PASS:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: fpm-monolith-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
  redis_data:
