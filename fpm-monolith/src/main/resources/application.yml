spring:
  application:
    name: fpm-monolith
  profiles:
    active: monolith
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:dev}
    password: ${DB_PASS:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  main:
    allow-bean-definition-overriding: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:supersecretkeyforfpm2025mustbelongenoughotherwiseitwillthrowanexception}

app:
  jwt:
    refreshTokenExpirationMs: 604800000

monolith:
  security:
    permit-all:
      - "/api/v1/auth/**"
      - "/swagger-ui/**"
      - "/api-docs/**"
      - "/actuator/**"
