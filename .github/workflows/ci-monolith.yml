name: "CI/CD - Backend Monolith"

on:
  push:
    branches: [ main, develop, Dev_Mono ]
    paths:
      - 'fpm-monolith/**'
      - '.github/workflows/ci-monolith.yml'
  pull_request:
    branches: [ main, develop, Dev_Mono ]
    paths:
      - 'fpm-monolith/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github # Matches the server-id in setup-java's generated settings.xml
          cache: maven

      - name: Build Monolith JAR
        run: |
          cd fpm-monolith
          mvn clean package -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        run: |
          cd fpm-monolith
          mvn test -B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------
      # Option A: Push to Docker Hub (if secrets are set)
      # ----------------------------------------------------
      - name: Login to Docker Hub
        if: ${{ env.HAS_DOCKERHUB_SECRETS == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          HAS_DOCKERHUB_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

      - name: Build and Push Docker Image to Docker Hub
        if: ${{ env.HAS_DOCKERHUB_SECRETS == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./fpm-monolith
          file: ./fpm-monolith/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fpm-monolith:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fpm-monolith:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          HAS_DOCKERHUB_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

      # ----------------------------------------------------
      # Option B: Push to GitHub Container Registry (Fallback)
      # ----------------------------------------------------
      - name: Login to GitHub Container Registry
        if: ${{ env.HAS_DOCKERHUB_SECRETS == 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          HAS_DOCKERHUB_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

      - name: Build and Push Docker Image to GHCR
        if: ${{ env.HAS_DOCKERHUB_SECRETS == 'false' }}
        uses: docker/build-push-action@v5
        with:
          context: ./fpm-monolith
          file: ./fpm-monolith/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fpm-monolith:latest
            ghcr.io/${{ github.repository_owner }}/fpm-monolith:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          HAS_DOCKERHUB_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
